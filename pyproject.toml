[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finovate-post-transcript"
version = "0.1.0"
description = "Post-transcript financial scam intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<2",
    "librosa>=0.10,<1",
    "resemblyzer>=0.1.4,<0.2",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
where = ["src"]
